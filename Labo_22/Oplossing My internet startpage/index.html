<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
    <title>My Internet Start Page</title>
</head>
<body>
    <div class="container">
        <h1>My Internet Start Page</h1>
            <div class="form-group">
                <label for="commandoInput">Zoekopdracht</label>
                <input type="text" class="form-control form-control-lg" id="commandoInput" aria-describedby="commandHelp" placeholder="Enter commando">
                <small id="commandHelp" class="form-text text-muted">Start your commando with "/[character] [zoekopdracht]"</small>
            </div>
            <button type="button" class="btn btn-success btn-lg btn-block w-100" id="btnGo">GO!</button>
        <div class="container" id="resultContainer">
            <h2>History</h2>
            <div class="row">

            </div>
        </div>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="scripts/code.js"></script>
</body>
</html>
